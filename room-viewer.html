<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Room 3D Image Viewer</title>
  <style>
    :root {
      --bg: #070912;
      --card: #111625;
      --card-soft: #171e31;
      --text: #e9eefc;
      --muted: #90a0c0;
      --accent: #4cc9f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Segoe UI", Roboto, system-ui, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 10%, #1a1f35 0%, var(--bg) 45%), var(--bg);
      display: flex;
      flex-direction: column;
    }

    header {
      width: min(1100px, 92vw);
      margin: 1.4rem auto 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .home-link {
      color: var(--muted);
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 0.55rem 0.9rem;
      border-radius: 999px;
      transition: 0.25s;
      font-size: 0.88rem;
    }

    .home-link:hover { color: var(--text); border-color: var(--accent); }

    main {
      flex: 1;
      width: min(1100px, 92vw);
      margin: 1rem auto 2rem;
    }

    .viewer-panel {
      background: linear-gradient(160deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 20px;
      backdrop-filter: blur(8px);
      box-shadow: 0 16px 60px rgba(0, 0, 0, 0.38);
      padding: clamp(1rem, 2.8vw, 1.5rem);
      display: grid;
      gap: 1rem;
    }

    .title-wrap h1 { margin: 0 0 0.2rem; font-size: clamp(1.5rem, 4vw, 2.2rem); }
    .title-wrap p { margin: 0; color: var(--muted); font-size: 0.94rem; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.7rem;
    }

    .file-input {
      appearance: none;
      border: 1px dashed rgba(255,255,255,0.28);
      color: var(--text);
      padding: 0.7rem 0.9rem;
      border-radius: 12px;
      background: var(--card-soft);
      cursor: pointer;
      width: min(340px, 100%);
    }

    .btn {
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--text);
      background: transparent;
      border-radius: 12px;
      padding: 0.7rem 1rem;
      cursor: pointer;
      transition: 0.2s;
      font-weight: 600;
    }

    .btn:hover { border-color: var(--accent); color: var(--accent); }

    .viewer-stage {
      min-height: 55vh;
      perspective: 1100px;
      transform-style: preserve-3d;
      display: grid;
      place-items: center;
    }

    .tilt-stage {
      width: 100%;
      max-width: 920px;
      border-radius: 18px;
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.12s ease-out;
      border: 1px solid rgba(255,255,255,0.12);
      background: var(--card);
      touch-action: none;
    }

    /*
      We pan/zoom by changing transform-origin + scale on this image.
      transform-origin is where the zoom focuses, based on cursor/touch position.
    */
    .tilt-stage img {
      width: 100%;
      height: min(70vh, 620px);
      object-fit: cover;
      display: block;
      transform: translateZ(30px) scale(1);
      transform-origin: 50% 50%;
      transition: transform 0.12s ease-out;
      will-change: transform, transform-origin;
    }

    .shine {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255,255,255,0.22), transparent 48%);
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .viewer-panel.active .shine { opacity: 1; }

    .placeholder {
      text-align: center;
      color: var(--muted);
      padding: 3rem 1rem;
      font-size: 1rem;
    }

    .zoom-readout {
      color: var(--muted);
      font-size: 0.9rem;
      margin-left: 0.35rem;
    }

    @media (max-width: 780px) {
      .controls { flex-direction: column; align-items: stretch; }
      .tilt-stage img { height: min(55vh, 460px); }
      header { margin-top: 1rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="title-wrap">
      <h1>Room 3D Image Viewer</h1>
      <p>Upload an image, then use tilt + zoom controls to explore details.</p>
    </div>
    <a class="home-link" href="index.html">← Back to Portfolio</a>
  </header>

  <main>
    <section id="viewerPanel" class="viewer-panel">
      <div class="controls">
        <input id="imageInput" class="file-input" type="file" accept="image/*" />
        <button id="zoomInBtn" class="btn" type="button">Zoom In</button>
        <button id="zoomOutBtn" class="btn" type="button">Zoom Out</button>
        <button id="resetViewBtn" class="btn" type="button">Reset View</button>
        <span id="zoomReadout" class="zoom-readout">Zoom: 1.00x</span>
      </div>

      <section id="viewerStage" class="viewer-stage">
        <div id="tiltStage" class="tilt-stage" aria-live="polite">
          <div id="placeholder" class="placeholder">No image selected yet. Choose an image file to preview it locally in your browser.</div>
          <img id="previewImage" alt="Uploaded image preview" hidden />
          <div class="shine"></div>
        </div>
      </section>
    </section>
  </main>

  <script>
    const imageInput = document.getElementById('imageInput');
    const zoomInBtn = document.getElementById('zoomInBtn');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const resetViewBtn = document.getElementById('resetViewBtn');
    const zoomReadout = document.getElementById('zoomReadout');
    const previewImage = document.getElementById('previewImage');
    const placeholder = document.getElementById('placeholder');
    const viewerPanel = document.getElementById('viewerPanel');
    const tiltStage = document.getElementById('tiltStage');

    // Zoom state values.
    let zoomLevel = 1;
    const MIN_ZOOM = 1;
    const MAX_ZOOM = 3;
    const ZOOM_STEP = 0.2;

    // Current pointer focus in percentages (0..100).
    // This is the key to "zoom any area" behavior.
    let focusX = 50;
    let focusY = 50;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function updateZoomReadout() {
      zoomReadout.textContent = `Zoom: ${zoomLevel.toFixed(2)}x`;
    }

    /*
      Applies both tilt and zoom/pan together.
      - rotateX/rotateY = fake 3D tilt
      - transform-origin = area to zoom into (pointer position)
      - scale(zoomLevel) = zoom amount
      - translate(...) = small parallax movement for depth feeling
    */
    function renderTransforms(px = 0.5, py = 0.5) {
      const rotateY = (px - 0.5) * 16;
      const rotateX = (0.5 - py) * 16;

      tiltStage.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
      previewImage.style.transformOrigin = `${focusX}% ${focusY}%`;
      previewImage.style.transform = `translateZ(30px) scale(${zoomLevel}) translate(${(px - 0.5) * 8}px, ${(py - 0.5) * 8}px)`;
      tiltStage.style.setProperty('--x', `${px * 100}%`);
      tiltStage.style.setProperty('--y', `${py * 100}%`);
    }

    function normalizePointer(clientX, clientY) {
      const rect = tiltStage.getBoundingClientRect();
      const x = clientX - rect.left;
      const y = clientY - rect.top;
      const px = clamp(x / rect.width, 0, 1);
      const py = clamp(y / rect.height, 0, 1);
      return { px, py };
    }

    function applyPointer(clientX, clientY) {
      if (previewImage.hidden) return;

      const { px, py } = normalizePointer(clientX, clientY);

      // Update focus point so zoom follows cursor/finger area.
      focusX = px * 100;
      focusY = py * 100;

      // Re-render with latest pointer and focus.
      renderTransforms(px, py);
    }

    function resetView() {
      zoomLevel = 1;
      focusX = 50;
      focusY = 50;
      tiltStage.style.transform = 'rotateX(0deg) rotateY(0deg)';
      previewImage.style.transformOrigin = '50% 50%';
      previewImage.style.transform = 'translateZ(30px) scale(1)';
      tiltStage.style.setProperty('--x', '50%');
      tiltStage.style.setProperty('--y', '50%');
      updateZoomReadout();
    }

    function resetAll() {
      previewImage.hidden = true;
      previewImage.removeAttribute('src');
      placeholder.hidden = false;
      viewerPanel.classList.remove('active');
      imageInput.value = '';
      resetView();
    }

    function zoomIn() {
      if (previewImage.hidden) return;
      zoomLevel = clamp(zoomLevel + ZOOM_STEP, MIN_ZOOM, MAX_ZOOM);
      renderTransforms(focusX / 100, focusY / 100);
      updateZoomReadout();
    }

    function zoomOut() {
      if (previewImage.hidden) return;
      zoomLevel = clamp(zoomLevel - ZOOM_STEP, MIN_ZOOM, MAX_ZOOM);
      renderTransforms(focusX / 100, focusY / 100);
      updateZoomReadout();
    }

    imageInput.addEventListener('change', (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        alert('Please select an image file.');
        resetAll();
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        previewImage.src = e.target?.result;
        previewImage.hidden = false;
        placeholder.hidden = true;
        viewerPanel.classList.add('active');
        resetView();
      };
      reader.readAsDataURL(file);
    });

    // Desktop mouse interactions.
    tiltStage.addEventListener('mousemove', (e) => applyPointer(e.clientX, e.clientY));

    // Mobile touch interactions.
    tiltStage.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      if (touch) applyPointer(touch.clientX, touch.clientY);
    }, { passive: true });

    // Return tilt to neutral when leaving area, but keep zoom state.
    tiltStage.addEventListener('mouseleave', () => {
      if (previewImage.hidden) return;
      renderTransforms(0.5, 0.5);
    });

    zoomInBtn.addEventListener('click', zoomIn);
    zoomOutBtn.addEventListener('click', zoomOut);
    resetViewBtn.addEventListener('click', resetView);

    updateZoomReadout();
  </script>
</body>
</html>
